name: Sync from upstream

on:
  # Weekly, which is what makes committing this file the whole of turning
  # auto-update on: there is no second switch to find and nothing to come
  # back and click. Monday morning UTC, at a minute nowhere near the top
  # of the hour -- GitHub runs scheduled jobs on a shared queue and delays
  # the ones piled onto :00 (docs.github.com/actions/reference/workflows-and-actions/events-that-trigger-workflows,
  # checked 2026-08-31).
  #
  # A run against an unchanged upstream pushes nothing and redeploys
  # nothing (see "Commit and push" below), so the cost of the cadence is
  # roughly a minute of Actions time a week, free on public repos.
  #
  # Worth knowing: GitHub disables scheduled workflows in a repository
  # with 60 days of no activity and emails the owner, so a relay left
  # entirely alone can stop checking. A sync that lands a commit is
  # itself activity, so this only bites when upstream has also been
  # quiet -- and re-enabling is one button on the Actions tab.
  schedule:
    - cron: "23 6 * * 1"

  # Kept beside the schedule, not replaced by it: this is the "check now"
  # button for someone who has just read about a fix and does not want to
  # wait until Monday.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # The "Deploy to Cloudflare" button clones this repo into the user's account as an
    # independent repo, not a GitHub fork, so this workflow ships inside every downstream
    # copy too. Guard so it no-ops when it runs in the upstream repo itself.
    if: github.repository != 'sybenx/bothy'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/sybenx/bothy.git
          git fetch upstream main

      - name: Pull in upstream files
        run: git checkout upstream/main -- .

      - name: Restore local config
        # wrangler.jsonc holds the D1/KV/R2 IDs Cloudflare provisioned for this deployment,
        # and .github/ holds this workflow itself — neither must ever be overwritten by upstream.
        run: git checkout HEAD -- wrangler.jsonc .github/

      - name: Stage deletions
        run: |
          git diff --diff-filter=D --name-only HEAD upstream/main \
            | grep -v '^\.github/' \
            | xargs -r git rm --

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git add -A
          git commit -m "Sync from upstream (sybenx/bothy)"
          git push origin HEAD:${{ github.ref_name }}
