<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bothy claim link</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 30rem;
    margin: 3rem auto 0;
    padding: 0 1.25rem;
    line-height: 1.5;
  }
  #link {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    padding: 0.75rem;
    border: 1px solid #8884;
    border-radius: 0.5rem;
    overflow-wrap: anywhere;
  }
  button { margin-top: 0.75rem; padding: 0.5rem 0.9rem; cursor: pointer; }
</style>
</head>
<body>
<!-- The self-hosted fallback of QR_SECRET_TRANSFER.md's bounce page
     (spec's own 11.2a): a client scanning the QR with its own camera never
     reaches this page at all -- it reads the URL fragment directly and
     pairs, making no HTTP request. This is what a *generic* camera app
     lands on instead, and per that section it does exactly one thing:
     read the fragment (never sent to any server -- it's a fragment) and
     offer it back as copyable text. There is nothing else to do here:
     bothy has no signer of its own to hand this to, so this page cannot
     "act as a party itself" the way the spec allows a real bounce host to.
-->
<p>This is a claim link for a bothy relay. Paste it into a Nostr signer
that supports claiming, or copy it to your signer app's browser.</p>
<div id="link">(no link found in the page address)</div>
<button id="copy-btn" hidden>Copy link</button>
<script>
// Deliberately reads location.hash and nothing else -- see the comment
// above. Never sent to a server; this page needs no server-side route of
// its own and is plain static content, same as the rest of public/.
const hash = location.hash.slice(1);
if (hash) {
  document.getElementById("link").textContent = location.href;
  const btn = document.getElementById("copy-btn");
  btn.hidden = false;
  btn.addEventListener("click", () => navigator.clipboard.writeText(location.href));
}
</script>
</body>
</html>
